name: Release to Pgyer
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*', '[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
concurrency:
  group: cnote-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CNOTE_KEYSTORE: .signing/release.jks
      CNOTE_STORE_PASSWORD: ${{ secrets.CNOTE_STORE_PASSWORD }}
      RELEASE_VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate version and prepare release notes
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from release import version_code
          version = os.environ['RELEASE_VERSION'].removeprefix('v')
          code = version_code(version)
          tag = os.environ['GITHUB_REF_NAME']
          query = subprocess.run(['gh','release','view','--json','tagName','--jq','.tagName'], capture_output=True, text=True)
          if query.returncode and 'release not found' not in query.stderr.lower():
              raise SystemExit('Cannot verify the latest release; retry later')
          previous = query.stdout.strip()
          if query.returncode == 0 and code <= version_code(previous):
              raise SystemExit('Release version must be newer than the latest published version')
          folder = Path('artifacts'); folder.mkdir(exist_ok=True)
          notes = subprocess.check_output(['git','log',f'{previous}..HEAD' if previous else 'HEAD','--pretty=format:- %s','--max-count=100'], text=True)[:60000]
          (folder/'release-notes.md').write_text(f'CNote {version}\n\n'+notes+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('RELEASE_TAG='+tag+'\n')
          PY
      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.CNOTE_KEYSTORE_BASE64 }}
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          test -n "$CNOTE_STORE_PASSWORD"
          test -n "$PGYER_API_KEY"
          mkdir -p .signing
          printf '%s' "$SIGNING_KEY" | base64 --decode > .signing/release.jks
          chmod 600 .signing/release.jks
      - name: Build and validate
        run: |
          ./gradlew testDebugUnitTest lintRelease assembleRelease -PreleaseVersion="$RELEASE_VERSION" --stacktrace
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/CNote-release.apk
          cp app/build/outputs/mapping/release/mapping.txt artifacts/mapping.txt
          python3 scripts/release.py --apk artifacts/CNote-release.apk --tag "$RELEASE_TAG" --notes artifacts/release-notes.md --out artifacts/update.json
          python3 -m unittest discover -s scripts/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: cnote-${{ env.RELEASE_TAG }}
          path: artifacts/
          if-no-files-found: error
      - name: Publish to Pgyer and wait for availability
        id: pgyer
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
        run: python3 scripts/publish_pgyer.py --apk artifacts/CNote-release.apk --notes artifacts/release-notes.md --out artifacts/pgyer.json
      - name: Publish GitHub release and update mirror
        run: |
          printf '\n蒲公英下载：%s\n' '${{ steps.pgyer.outputs.url }}' >> artifacts/release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --title "CNote $RELEASE_VERSION" --notes-file artifacts/release-notes.md artifacts/CNote-release.apk artifacts/update.json artifacts/mapping.txt
          printf '### CNote %s\n\n[蒲公英下载](%s)\n\n[GitHub Release](%s/releases/tag/%s)\n' "$RELEASE_VERSION" '${{ steps.pgyer.outputs.url }}' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
