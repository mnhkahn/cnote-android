<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,interactive-widget=resizes-content"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: https:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"><title>CNote</title><link rel="stylesheet" href="icons.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css"></head><body>
<header><div id="toolbar" role="toolbar" aria-label="文本格式"></div><div hidden><button id="save">保存</button><button id="print">打印</button><button id="export">导出</button></div></header>
<main><div id="empty"><i class="bi bi-journal-text"></i><h1>随手记下来</h1><p>新建或选择一篇笔记<br>所有编辑自动保存到本机</p></div><article id="document" hidden><div id="editor" contenteditable="true" data-placeholder="开始记录…" spellcheck="true" role="textbox" aria-label="笔记内容" aria-multiline="true"></div></article></main>
<footer><span id="status">已保存到本机</span><span id="count"></span></footer><dialog id="dialog"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-actions"></div></dialog><div id="context" hidden></div><div id="image-selection" hidden aria-hidden="true"></div>
<div id="image-actions" hidden role="toolbar" aria-label="图片操作"><button type="button" data-image-action="view">放大查看</button><button type="button" data-image-action="copy">复制图片</button><button type="button" data-image-action="cut">剪切图片</button><button type="button" data-image-action="delete" title="删除图片（可撤销）">删除</button></div>
<script src="editor.js"></script></body></html>
